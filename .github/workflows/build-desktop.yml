name: Build Desktop (Electron)

# Builds DAI-Miner for Linux, macOS, and Windows on GitHub runners, renames the
# outputs to STABLE (version-less) asset names, and attaches them to the GitHub
# Release for the pushed tag. The landing page links to
#   https://github.com/iamaihub/dai-miner/releases/latest/download/<stable-name>
# which always resolves to the newest release — so no manual uploads, ever.
#
# Trigger: push a version tag (v0.4.6, …) or run manually from the Actions tab.
# macOS builds are AD-HOC signed via afterPack.cjs hook (no Apple cert needed;
# required for arm64 to avoid "malware" hard-block). NOT notarized.
# Windows/Linux are unsigned. macOS first launch:
#   right-click → Open, or  xattr -cr /Applications/DAI-Miner.app

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Build only this runner (blank builds all). Example: macos-15-intel'
        required: false
        default: ''
        type: string
  push:
    tags: ['v*']

permissions:
  contents: write            # release step uploads assets

jobs:
  # matrix is not available in a job-level if, so a manual single-runner
  # rebuild picks its row here. A tag push keeps the full set.
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        env:
          EVENT: ${{ github.event_name }}
          RUNNER: ${{ inputs.runner }}
        run: |
          set -euo pipefail
          # One runner per arch. The QVAC worker bundle embeds the native
          # addons of the machine that built it.
          all='[
            {"os":"ubuntu-24.04","platform":"linux"},
            {"os":"ubuntu-24.04-arm","platform":"linux"},
            {"os":"macos-15","platform":"mac"},
            {"os":"macos-15-intel","platform":"mac"},
            {"os":"windows-latest","platform":"win"}
          ]'
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$RUNNER" ]; then
            rows=$(jq -c --arg os "$RUNNER" '[.[] | select(.os == $os)]' <<<"$all")
            if [ "$rows" = "[]" ]; then
              echo "Unknown runner: $RUNNER" >&2
              exit 1
            fi
          else
            rows=$(jq -c '.' <<<"$all")
          fi
          echo "matrix=$(jq -c '{include:.}' <<<"$rows")" >> "$GITHUB_OUTPUT"

  build:
    needs: select
    strategy:
      fail-fast: false        # one platform failing shouldn't kill the others
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      # Repo gitignores lockfiles → no `cache: npm`, and `npm install` (not `npm ci`).
      # Node 22, not 20: with floating deps, bare-pack pulls a bare-module-lexer
      # prebuild that needs the node_api_is_sharedarraybuffer Node-API symbol.
      # Node 20 does not export it, so `bundle:qvac` died with
      # "undefined symbol: node_api_is_sharedarraybuffer" (linux) and
      # "missing symbol called" (macOS). 22.x has it, and matches production.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build (${{ matrix.platform }})
        env:
          # Skip electron-builder's built-in signing (it doesn't support ad-hoc).
          # Our afterPack.cjs hook handles ad-hoc codesigning for macOS ARM64.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # No GH_TOKEN here on purpose: it would make electron-builder auto-publish
          # versioned names + latest-*.yml (auto-update metadata the app doesn't use).
          # The "Attach to GitHub Release" step below owns the release, stable names only.
        shell: bash
        run: |
          set -euo pipefail
          platform="${{ matrix.platform }}"
          if [ "$platform" != "mac" ]; then
            npm run "build:electron:${platform}"
            exit 0
          fi
          # macos-15-intel fails hdiutil detach with "Resource busy" (exit 16)
          # after the DMG is written. electron-builder retries that eject for a
          # few seconds and then gives up. Detach leftover images and rebuild once.
          cleanup_images() {
            hdiutil info | awk '
              /^\/dev\/disk/ { dev=$1 }
              /image-path:/ {
                if (dev != "" && $0 ~ /(dmg|electron|DAI-Miner)/) print dev
                dev=""
              }
            ' | while read -r dev; do
              hdiutil detach -force "$dev" || true
            done
          }
          if npm run build:electron:mac; then
            exit 0
          fi
          echo "Mac DMG build failed. Detaching leftover images and retrying once."
          cleanup_images || true
          sleep 20
          rm -rf dist/electron
          npm run build:electron:mac

      # electron-builder writes versioned names into dist/electron (build.directories.output).
      # Copy them to the stable landing names so the release URLs never change.
      - name: Stage release assets (stable names)
        shell: bash
        run: |
          set -e
          mkdir -p out
          shopt -s nullglob
          case "${{ matrix.platform }}" in
            linux)
              for f in dist/electron/*.AppImage; do
                case "$f" in
                  *arm64*) cp "$f" out/dai-miner-linux-arm64.AppImage ;;
                  *)       cp "$f" out/dai-miner-linux-x64.AppImage ;;
                esac
              done ;;
            win)
              # NSIS installer is the "... Setup ....exe"; portable is the plain one.
              for f in dist/electron/*Setup*.exe;                do cp "$f" out/dai-miner-windows-x64.exe ; done
              for f in dist/electron/*.exe; do case "$f" in *Setup*) ;; *) cp "$f" out/dai-miner-windows-x64-portable.exe ;; esac; done ;;
            mac)
              # Landing naming: Apple Silicon (arm64) = "amd", Intel (x64) = "intel".
              for f in dist/electron/*.dmg; do
                case "$f" in
                  *arm64*) cp "$f" out/dai-miner-macos-amd.dmg ;;
                  *)       cp "$f" out/dai-miner-macos-intel.dmg ;;
                esac
              done ;;
          esac
          ls -lh out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dai-miner-${{ matrix.platform }}-${{ runner.arch }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

      # On a version tag, attach the stable-named files to the Release (all three
      # matrix jobs append to the same release for the tag).
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          fail_on_unmatched_files: true
